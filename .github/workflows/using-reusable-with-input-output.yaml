name: Using Reusable Workflow with Input and Output
on:
  workflow_dispatch:
jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-with-input-output.yaml
    with:
      username: "John Doe"
  use_greeting:
    needs: call_reusable_workflow
    runs-on: ubuntu-latest
    steps:
      - name: Use Greeting
        run: echo "${{ needs.call_reusable_workflow.outputs.greeting }}"
